services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: plantation
      POSTGRES_PASSWORD: plantation
      POSTGRES_DB: plantation
    ports:
      - "5432:5432"
    volumes:
      - plantation-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantation -d plantation"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  plantation-pg:

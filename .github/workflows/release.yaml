# Release: multi-arch image + semver git tag + chart write-back.
#
# Tagging strategy (automatic on every push to main that is not a write-back):
#   1. Read the latest vX.Y.Z tag. None → 0.1.0 and stop looking at commits.
#   2. Otherwise inspect subjects/bodies since that tag:
#        type!: …  or  BREAKING CHANGE:  → major
#        feat: …  /  feat(scope): …      → minor
#        anything else                   → patch
#   Renovate always commits fix(deps): so its merges are patches, even when the
#   dependency update itself is a minor or major.
#   3. Publish docker.io/…/plantation:X.Y.Z and :sha-<short> (never latest).
#   4. Write image.tag / appVersion on main (Argo syncs that; no App edit).
#   5. Push annotated git tag vX.Y.Z on the built commit.
#
# workflow_dispatch is an override (force patch/minor/major or an exact X.Y.Z),
# not the normal path. Pushing a vX.Y.Z tag yourself still publishes that version.
#
# Loop guards (any one alone is fragile — keep all three):
# 1. Push the write-back with the default GITHUB_TOKEN, which does not
#    start new workflow runs.
# 2. paths-ignore on the write-back files.
# 3. [skip ci] in the bot commit message.
#
# Never retag an existing X.Y.Z. Never publish `latest`.

name: Release

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths-ignore:
      - "deploy/chart/values.yaml"
      - "deploy/chart/Chart.yaml"
  workflow_dispatch:
    inputs:
      bump:
        description: Override the commit-based bump (ignored when version is set).
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Optional exact X.Y.Z. Leave empty to use the tagging strategy.
        required: false
        type: string

permissions: {}

concurrency:
  group: plantation-release
  cancel-in-progress: false

jobs:
  push-image:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/plantation
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image tags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_BUMP: ${{ inputs.bump }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          sha="sha-${GITHUB_SHA::7}"
          echo "sha_tag=${sha}" >> "$GITHUB_OUTPUT"

          latest_semver() {
            git tag -l 'v*.*.*' \
              | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' \
              | sort -V \
              | tail -n1
          }

          bump_semver() {
            local latest="$1" kind="$2"
            if [ -z "${latest}" ]; then
              echo "0.1.0"
              return
            fi
            local major="${latest%%.*}"
            local rest="${latest#*.}"
            local minor="${rest%%.*}"
            local patch="${rest#*.}"
            case "${kind}" in
              major) major=$((10#${major} + 1)); minor=0; patch=0 ;;
              minor) minor=$((10#${minor} + 1)); patch=0 ;;
              patch) patch=$((10#${patch} + 1)) ;;
              *) echo "unknown bump ${kind}" >&2; return 1 ;;
            esac
            echo "${major}.${minor}.${patch}"
          }

          # Highest bump among commits after v${latest}. First release skips this.
          bump_from_commits() {
            local latest="$1"
            local subjects bodies
            subjects="$(git log --format='%s' "v${latest}..HEAD")"
            bodies="$(git log --format='%b' "v${latest}..HEAD")"
            if printf '%s\n' "${subjects}" | grep -qE '^[a-z]+(\([^)]+\))?!:' \
              || printf '%s\n' "${bodies}" | grep -qE '^BREAKING CHANGE:'; then
              echo major
            elif printf '%s\n' "${subjects}" | grep -qE '^feat(\([^)]+\))?:'; then
              echo minor
            else
              echo patch
            fi
          }

          release=""
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${REF}" != "refs/heads/main" ]; then
              echo "versioned releases must run from main (got ${REF})" >&2
              exit 1
            fi
            if [ -n "${DISPATCH_VERSION}" ]; then
              release="${DISPATCH_VERSION#v}"
            else
              release="$(bump_semver "$(latest_semver)" "${DISPATCH_BUMP}")"
            fi
          elif [ "${REF_TYPE}" = "tag" ]; then
            release="${REF_NAME#v}"
          elif [ "${REF}" = "refs/heads/main" ]; then
            latest="$(latest_semver)"
            if [ -z "${latest}" ]; then
              release="0.1.0"
            else
              release="$(bump_semver "${latest}" "$(bump_from_commits "${latest}")")"
            fi
          fi
          if [ -n "${release}" ]; then
            echo "${release}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "version must be X.Y.Z, got ${release}" >&2; exit 1; }
            if [ "${REF_TYPE}" != "tag" ]; then
              existing="$(git ls-remote --tags origin "refs/tags/v${release}")"
              if [ -n "${existing}" ]; then
                echo "git tag v${release} already exists; bump instead of reusing" >&2
                exit 1
              fi
            fi
          fi
          echo "release_tag=${release}" >> "$GITHUB_OUTPUT"
          echo "resolved release_tag=${release:-<none>} sha=${sha}"

          tags="${IMAGE}:${sha}"
          if [ -n "${release}" ]; then
            tags="${tags},${IMAGE}:${release}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "version_arg=${release:-${sha}}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version_arg }}
            COMMIT=${{ github.sha }}

  write-back:
    name: Write semver to chart
    needs: push-image
    if: needs.push-image.outputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install yq
        env:
          YQ_VERSION: v4.44.6
        run: |
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /tmp/yq
          chmod +x /tmp/yq
          sudo mv /tmp/yq /usr/local/bin/yq
          yq --version

      # DOCKERHUB_TOKEN is intentionally not in this job.
      # Argo tracks plantation main; writing image.tag here is what rolls the cluster.
      - name: Commit image.tag and push
        env:
          IMAGE_TAG: ${{ needs.push-image.outputs.release_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            export IMAGE_TAG
            yq -i '.image.tag = strenv(IMAGE_TAG) | .image.tag style="double"' \
              deploy/chart/values.yaml
            yq -i '.appVersion = strenv(IMAGE_TAG) | .appVersion style="double"' \
              deploy/chart/Chart.yaml
            got="$(yq '.image.tag' deploy/chart/values.yaml)"
            if [ "${got}" != "${IMAGE_TAG}" ]; then
              echo "yq wrote ${got}, expected ${IMAGE_TAG}" >&2
              exit 1
            fi
            if git diff --quiet -- deploy/chart/values.yaml deploy/chart/Chart.yaml; then
              echo "image.tag already ${IMAGE_TAG}"
              exit 0
            fi
            git add deploy/chart/values.yaml deploy/chart/Chart.yaml
            git commit -m "chore(chart): deploy ${IMAGE_TAG} [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); fetching and retrying"
          done
          echo "write-back push failed after 5 attempts" >&2
          exit 1

      # Tag the built commit, not the write-back. After the chart so a failed
      # tag can be retried without inventing a new version.
      - name: Push git tag
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ needs.push-image.outputs.release_tag }}
          BUILT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          existing="$(git ls-remote --tags origin "refs/tags/v${IMAGE_TAG}")"
          if [ -n "${existing}" ]; then
            echo "git tag v${IMAGE_TAG} already on origin"
            exit 0
          fi
          git fetch origin "${BUILT_SHA}"
          git tag -a "v${IMAGE_TAG}" "${BUILT_SHA}" -m "v${IMAGE_TAG}"
          git push origin "refs/tags/v${IMAGE_TAG}"

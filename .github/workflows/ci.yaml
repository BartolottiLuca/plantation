# CI: lint, test, helm lint, and a no-push image smoke build.
#
# The release write-back commit (values.yaml + Chart.yaml) must not rebuild CI.
# That used to be done with paths-ignore on those two files, but paths-ignore
# cannot tell the bot from a human: GitHub skips a workflow when EVERY changed
# path matches, so a human commit touching only values.yaml — replicaCount, a
# resource limit, a probe — skipped helm lint too. The skip is now keyed on the
# commit author instead, so the bot is ignored and humans never are.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# No Docker Hub secrets. Fork PRs must stay runnable without DOCKERHUB_TOKEN.
permissions:
  contents: read

jobs:
  go:
    name: go vet, lint, test
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLANTATION_TEST_DSN: postgres://postgres:postgres@localhost:5432/plantation_test?sslmode=disable
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plantation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d plantation_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      # go.mod's `go 1.23` is a minimum, not a pin. Use 1.27 to match the
      # Dockerfile builder: yaml.v3's unpruned go.mod pulls
      # rogpeppe/go-internal (requires go >= 1.25) into `go mod download`.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: go test
        run: go test ./... -race

  helm:
    name: helm lint
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: helm lint
        run: helm lint deploy/chart

  docker:
    name: docker build
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Both release platforms, so an arm64-only break surfaces on the PR rather
      # than at release. Cheap: the Dockerfile cross-compiles from BUILDPLATFORM,
      # so neither arch needs qemu for the Go step.
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: plantation:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}

      # A multi-platform build stays in the builder and cannot be inspected, so
      # load one arch into the daemon. Layers come from the cache above.
      - name: Load amd64 image for inspection
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: plantation:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}

      # SPEC §14: the final stage is scratch, which ships no trust store. Losing
      # this COPY does not fail the build or the health checks — it silently
      # breaks Open-Meteo, Tado and Discord at runtime. Assert it here, because
      # nothing else will notice for 24 hours.
      - name: Assert the image carries a CA bundle
        run: |
          set -eu
          docker create --name ca-probe plantation:ci >/dev/null
          trap 'docker rm -f ca-probe >/dev/null 2>&1 || true' EXIT
          bytes=$(docker export ca-probe \
            | tar -xO etc/ssl/certs/ca-certificates.crt 2>/dev/null \
            | wc -c) || bytes=0
          echo "ca-certificates.crt: ${bytes} bytes"
          if [ "${bytes}" -lt 1000 ]; then
            echo "::error::final image has no usable CA bundle (${bytes} bytes)." \
              "scratch ships none, so every outbound HTTPS call would fail with" \
              "x509: certificate signed by unknown authority. See SPEC.md §14."
            exit 1
          fi

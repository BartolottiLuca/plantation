{{define "task-row"}}
<article class="task{{if .Preselected}} preselected{{end}}" id="task-{{.PlantID}}-{{.Slug}}"{{if .Preselected}} data-preselected="{{.Slug}}"{{end}}>
  <div class="task-body">
    <h3><a href="/plants/{{.PlantID}}">{{.PlantName}}</a></h3>
    <p class="kind">{{.Label}}</p>
    <p class="summary">{{.Summary}}</p>
    <p class="meta"><span class="status status-{{.Status}}">{{.StatusLabel}}</span> · {{.DueOn}}</p>
  </div>
  <form class="done" method="post" action="/plants/{{.PlantID}}/care/{{.Slug}}"
        hx-post="/plants/{{.PlantID}}/care/{{.Slug}}"
        hx-target="closest article"
        hx-swap="outerHTML">
    <button type="submit">Done</button>
  </form>
</article>
{{end}}

{{define "task-control"}}
<form class="task-control{{if .Suppressed}} suppressed{{end}}" method="post"
      action="/plants/{{.PlantID}}/tasks/{{.Slug}}">
  <h3>{{.Label}}{{if .Suppressed}} <span class="status status-off">not running</span>{{end}}</h3>
  <label>
    <input type="checkbox" name="enabled" value="1"{{if .Enabled}} checked{{end}}>
    Enabled
  </label>
  <label>
    Snooze until
    <input type="date" name="snooze_until" value="{{.SnoozedUntil}}">
  </label>
  {{if .CatalogDays}}
  <label>
    Every
    <input type="number" name="interval_days" min="1" max="3650"
           value="{{.IntervalDays}}" placeholder="{{.CatalogDays}}">
    days
  </label>
  {{else}}
  <p class="hint">Watering is scheduled from the water balance, not a fixed interval.</p>
  {{end}}
  <button type="submit">Save</button>
</form>
{{end}}

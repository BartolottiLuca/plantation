{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{template "title" .}}</title>
  <link rel="stylesheet" href="/static/style.css?v={{.StaticQuery}}">
  <script src="/static/htmx.min.js?v={{.StaticQuery}}" defer></script>
</head>
<body>
  {{if .DigestFailed}}
  <div class="banner" role="alert">Last digest failed — Discord did not get today’s reminder.</div>
  {{end}}
  <header>
    <p class="brand">Plantation</p>
    <nav aria-label="Main">
      <a href="/"{{if eq .Nav "dashboard"}} aria-current="page"{{end}}>Dashboard</a>
      <a href="/plants"{{if eq .Nav "plants"}} aria-current="page"{{end}}>Plants</a>
      <a href="/plants/new"{{if eq .Nav "add"}} aria-current="page"{{end}}>Add</a>
      <a href="/settings/diagnostics"{{if eq .Nav "settings"}} aria-current="page"{{end}}>Settings</a>
    </nav>
  </header>
  <main>
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}

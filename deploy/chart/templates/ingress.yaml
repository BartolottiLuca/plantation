{{- if .Values.ingress.enabled }}
{{/*
Optional: a Cloudflare Tunnel may target the Service directly instead, in which
case leave ingress.enabled false. Either way, Cloudflare Access in front of the
public hostname is required — the app has no authentication of its own
(SPEC.md §14).
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "plantation.fullname" . }}
  labels:
    {{- include "plantation.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "plantation.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}

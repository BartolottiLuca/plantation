{{- if gt (.Values.replicaCount | int) 1 }}
{{- fail "replicaCount must stay 1 — SPEC.md §9/§14: two schedulers race Tado token refreshes and can double-send the Discord digest." }}
{{- end }}
{{- if and .Values.config.weatherEnabled (or (eq .Values.config.latitude nil) (eq .Values.config.longitude nil)) }}
{{- fail "config.weatherEnabled is true but config.latitude/config.longitude are unset — fill them in (see deploy/README.md) or set config.weatherEnabled: false." }}
{{- end }}
{{- if and .Values.postgresql.enabled (not (eq .Values.externalDatabase.existingSecretName "")) }}
{{- fail "postgresql.enabled and externalDatabase.existingSecretName are both set — pick one database source." }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) (eq .Values.externalDatabase.existingSecretName "") }}
{{- fail "postgresql.enabled is false but externalDatabase.existingSecretName is unset — set it to a Secret containing PLANTATION_DATABASE_URL." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plantation.fullname" . }}
  labels:
    {{- include "plantation.labels" . | nindent 4 }}
spec:
  # Exactly 1, guarded above. Recreate (not RollingUpdate): with a rolling update
  # two pods briefly overlap, and the advisory lock survives that but nobody wants
  # two schedulers on purpose (SPEC.md §9/§14).
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "plantation.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "plantation.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # Matches the Dockerfile's numeric USER. scratch has no /etc/passwd, so
        # this must stay numeric for kubelet to verify runAsNonRoot.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plantation
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "plantation.fullname" . }}
          env:
            {{- if .Values.postgresql.enabled }}
            - name: PLANTATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-app
                  key: uri
            {{- else }}
            - name: PLANTATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecretName }}
                  key: {{ .Values.externalDatabase.existingSecretKey }}
            {{- end }}
            {{- if .Values.discord.existingSecretName }}
            - name: PLANTATION_DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.discord.existingSecretName }}
                  key: {{ .Values.discord.existingSecretKey }}
            {{- end }}
            {{- if .Values.writeToken.existingSecretName }}
            - name: PLANTATION_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.writeToken.existingSecretName }}
                  key: {{ .Values.writeToken.existingSecretKey }}
            {{- end }}
          livenessProbe:
            # /healthz must never touch the database — see internal/web/health.go.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # /readyz pings the database.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

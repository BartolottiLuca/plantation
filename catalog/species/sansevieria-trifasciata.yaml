common_name: Snake plant
scientific_name: Sansevieria trifasciata
description: >-
  A West African succulent grown for its stiff, upright, patterned leaves.
  Stores water in thick leaf tissue and photosynthesizes via CAM metabolism,
  which is the botanical reason it tolerates low light and long dry spells
  that would kill a thinner-leaved houseplant.
placement: indoor
kc: 0.3
substrate: cactus
mad: 0.7
base_interval_days: 10
min_interval_days: 5
max_interval_days: 30
dormant_months: [11, 12, 1, 2]
dormancy_factor: 0.4
min_temp_c: 10
frost_tender: true
tasks:
  - slug: fertilize
    kind: fertilize
    label: Feed
    interval_days: 60
    active_months: [4, 5, 6, 7, 8, 9]
  - slug: repot
    kind: repot
    label: Repot
    interval_days: 1095
care_advice: >-
  Tolerates low light and irregular attention; the one reliable way to kill it
  is a substrate that never dries out, so let it go bone-dry between
  waterings and err on the side of skipping one.
retired: false

common_name: Monstera
scientific_name: Monstera deliciosa
description: >-
  A Central American climbing aroid, grown indoors for its glossy,
  fenestrated leaves. Climbs in nature by clinging aerial roots, which is why
  a moss pole changes how it grows rather than being decorative.
placement: indoor
kc: 0.7
substrate: peat
mad: 0.5
base_interval_days: 6
min_interval_days: 3
max_interval_days: 21
dormant_months: [11, 12, 1, 2]
dormancy_factor: 0.5
min_temp_c: 12
frost_tender: true
tasks:
  - slug: prune
    kind: prune
    label: Prune
    interval_days: 120
    active_months: [3, 4, 5, 6, 7, 8]
  - slug: fertilize
    kind: fertilize
    label: Feed
    interval_days: 30
    active_months: [3, 4, 5, 6, 7, 8, 9]
  - slug: repot
    kind: repot
    label: Repot
    interval_days: 730
care_advice: >-
  Bright indirect light and a moss pole to climb keep the leaves fenestrating;
  let the top 3-5cm of soil dry between waterings, since yellowing lower
  leaves are almost always overwatering rather than a nutrient problem.
retired: false

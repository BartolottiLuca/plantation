common_name: Bigleaf hydrangea
scientific_name: Hydrangea macrophylla
description: >-
  A Japanese coastal shrub grown for its large mophead or lacecap flower
  clusters. Thirsty by name and nature — the genus Hydrangea comes from the
  Greek for "water vessel" — and most flower buds form on last year's wood.
placement: outdoor
kc: 1.1
substrate: peat
mad: 0.5
base_interval_days: 4
min_interval_days: 1
max_interval_days: 10
dormant_months: []
min_temp_c: -5
frost_tender: true
tasks:
  - slug: prune
    kind: prune
    label: Prune
    interval_days: 365
    active_months: [8, 9]
  - slug: fertilize
    kind: fertilize
    label: Feed
    interval_days: 30
    active_months: [3, 4, 5, 6, 7]
  - slug: repot
    kind: repot
    label: Repot
    interval_days: 730
care_advice: >-
  Wants consistently moist soil, especially in summer heat when it wilts
  visibly within a day of drying out; a late spring frost after the flower
  buds have broken dormancy can ruin the whole season's blooms.
retired: false

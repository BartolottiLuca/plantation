common_name: Boston fern
scientific_name: Nephrolepis exaltata
description: >-
  A humidity-loving fern from tropical forest floors, grown for dense arching
  fronds. Shallow-rooted and thin-leaved by nature, so it has almost no
  buffer against a dry substrate or dry indoor air.
placement: indoor
kc: 1.0
substrate: coir
mad: 0.3
base_interval_days: 3
min_interval_days: 1
max_interval_days: 10
dormant_months: [12, 1, 2]
dormancy_factor: 0.6
min_temp_c: 12
frost_tender: true
tasks:
  - slug: fertilize
    kind: fertilize
    label: Feed
    interval_days: 30
    active_months: [4, 5, 6, 7, 8, 9]
  - slug: repot
    kind: repot
    label: Repot
    interval_days: 365
care_advice: >-
  Wants a constantly moist substrate and humid air, not just watering on a
  schedule; crispy brown frond tips mean the air is too dry, not that it
  needs more water.
retired: false
